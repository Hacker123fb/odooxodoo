<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base Badge for universal tab visibility (Dark & Light browser themes) -->
  <rect width="64" height="64" rx="16" fill="#0F172A"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#borderGrad)" stroke-width="2" stroke-opacity="0.7"/>

  <defs>
    <linearGradient id="truckGrad" x1="18" y1="18" x2="42" y2="41" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Dynamic Transit Speed Lines -->
  <line x1="9" y1="25" x2="15" y2="25" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="6" y1="31" x2="14" y2="31" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="10" y1="37" x2="14" y2="37" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Fleet Cargo Container -->
  <rect x="17" y="18" width="23" height="23" rx="3.5" fill="url(#truckGrad)"/>
  <!-- Subtle container groove lines -->
  <line x1="24.5" y1="21" x2="24.5" y2="38" stroke="#1E40AF" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="32.5" y1="21" x2="32.5" y2="38" stroke="#1E40AF" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Aerodynamic Fleet Cab -->
  <path d="M40 24H49C50.2 24 51.3 24.6 51.9 25.7L55.3 32V40C55.3 40.55 54.85 41 54.3 41H40V24Z" fill="#38BDF8"/>

  <!-- Tinted Windshield Glass -->
  <path d="M42.5 26.5H48C48.6 26.5 49.1 26.8 49.5 27.4L52.2 32.5H42.5V26.5Z" fill="#0F172A"/>

  <!-- Rear Hazard Reflector -->
  <rect x="16" y="34.5" width="2" height="4" rx="1" fill="#F43F5E"/>

  <!-- Front LED Headlight -->
  <path d="M54.5 35H56V38H54.5V35Z" fill="#FACC15"/>

  <!-- Chassis Underframe -->
  <line x1="16" y1="41" x2="21.5" y2="41" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="32.5" y1="41" x2="42" y2="41" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
  <line x1="52.5" y1="41" x2="55.5" y2="41" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Heavy Duty Wheels -->
  <!-- Rear Wheels -->
  <circle cx="27" cy="42" r="5.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="27" cy="42" r="2.2" fill="#38BDF8"/>

  <!-- Front Wheels -->
  <circle cx="47.5" cy="42" r="5.5" fill="#0F172A" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="47.5" cy="42" r="2.2" fill="#38BDF8"/>
</svg>
